apiVersion: v1
kind: Secret
metadata:
  name: eakp-api-secret
  namespace: eakp
  labels:
    app.kubernetes.io/name: enterprise-ai-platform-api
type: Opaque
stringData:
  EAKP_DATABASE_URL: "postgresql+psycopg://eakp:replace-me@postgres:5432/eakp"
  EAKP_JWT_SECRET_KEY: "replace-with-at-least-32-random-characters"
