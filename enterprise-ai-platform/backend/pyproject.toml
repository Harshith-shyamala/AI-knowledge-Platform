[tool.poetry]
name = "enterprise-ai-platform-backend"
version = "0.1.0"
description = "FastAPI backend for the Enterprise AI Knowledge Platform."
authors = ["Harshith <harshith@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = ">=0.115.0,<1.0.0"
pydantic = ">=2.8.0,<3.0.0"
pydantic-settings = ">=2.4.0,<3.0.0"
psycopg = { extras = ["binary"], version = ">=3.2.0,<4.0.0" }
sqlalchemy = ">=2.0.0,<3.0.0"
uvicorn = { extras = ["standard"], version = ">=0.30.0,<1.0.0" }
alembic = ">=1.13.0,<2.0.0"
PyJWT = ">=2.8.0,<3.0.0"
python-multipart = ">=0.0.9,<1.0.0"

[tool.poetry.group.dev.dependencies]
httpx = ">=0.27.0,<1.0.0"
mypy = ">=1.10.0,<2.0.0"
pytest = ">=8.2.0,<9.0.0"
pytest-cov = ">=5.0.0,<7.0.0"
ruff = ">=0.5.0,<1.0.0"

[tool.poetry.scripts]
eakp-api = "app.main:run"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = []
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["uvicorn"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jwt"]
ignore_missing_imports = true
