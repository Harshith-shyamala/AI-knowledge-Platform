apiVersion: batch/v1
kind: Job
metadata:
  name: eakp-api-migrate
  namespace: eakp
  labels:
    app.kubernetes.io/name: enterprise-ai-platform-api
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-ai-platform-api
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: eakp-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/your-org/enterprise-ai-platform-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: eakp-api-config
            - secretRef:
                name: eakp-api-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
