apiVersion: v1
kind: Secret
metadata:
  name: eakp-postgres-secret
  namespace: eakp
  labels:
    app.kubernetes.io/name: eakp-postgres
type: Opaque
stringData:
  POSTGRES_DB: "eakp"
  POSTGRES_USER: "eakp"
  POSTGRES_PASSWORD: "replace-me"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: eakp-postgres
  namespace: eakp
  labels:
    app.kubernetes.io/name: eakp-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: eakp-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eakp-postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eakp-postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: eakp-postgres-secret
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - eakp
                - -d
                - eakp
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: eakp-postgres
  namespace: eakp
  labels:
    app.kubernetes.io/name: eakp-postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eakp-postgres
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
