apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eakp-api
  namespace: eakp
  labels:
    app.kubernetes.io/name: enterprise-ai-platform-api
spec:
  minReplicas: 2
  maxReplicas: 5
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eakp-api
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
