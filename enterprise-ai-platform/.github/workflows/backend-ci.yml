name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "deployment/docker/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "deployment/docker/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-ai-platform/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app tests

      - name: Test
        run: pytest --cov=app --cov-report=term-missing

